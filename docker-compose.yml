services:

    db:
        build: docker/db
        container_name: db_fzoc
        restart: always
        volumes:
            - db_data:/var/lib/mysql
        env_file:
            - .env

    http:
        build: docker/nginx
        restart: always
        volumes:
            - "./www:/usr/local/fzoc/www:rw"
        depends_on:
            - fpm
        env_file:
            - .env
        ports:
            - "${EXPOSE_HOST:-127.0.0.1}:${EXPOSE_PORT:-8090}:80"

    fpm:
        build: docker/php
        restart: always
        volumes:
            - "./www:/usr/local/fzoc/www:rw"
        depends_on:
            - db
        env_file:
            - .env

    worker:
        build: docker/php
        container_name: fzoc-worker
        restart: unless-stopped
        volumes:
            - "./www:/usr/local/fzoc/www:rw"
        depends_on:
            - db
        env_file:
            - .env
        environment:
            FZOC_TASK_INTERVAL: "${FZOC_TASK_INTERVAL:-2}"
            FZOC_MAINT_INTERVAL: "${FZOC_MAINT_INTERVAL:-3600}"
        command:
            - /bin/sh
            - /usr/local/fzoc/www/worker_loop.sh

volumes:
    db_data:
